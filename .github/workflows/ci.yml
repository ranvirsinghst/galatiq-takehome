name: Invoice agent checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.5.16'
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check invoice_agent main.py tests scripts
      - run: uv run ruff format --check invoice_agent main.py tests scripts
      - run: uv run mypy invoice_agent main.py scripts/evaluate.py
      - run: uv run pytest tests/unit tests/integration --cov=invoice_agent --cov-branch --cov-fail-under=80
      - run: uv run python scripts/evaluate.py
